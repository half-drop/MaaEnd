name: test-trayfix-dll

on:
  push:
    branches:
      - agent/fix-tray-cleanup
    paths:
      - "tools/trayfix-prototype/**"
      - ".github/workflows/test-trayfix-dll.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate full PowrProf proxy surface
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trayfix-build\generated | Out-Null
          .\tools\trayfix-prototype\generate_powrprof_proxy.ps1 -OutputDir trayfix-build\generated

      - name: Build full PowrProf proxy DLL
        shell: cmd
        run: |
          ml64 /nologo /c /Fo trayfix-build\powrprof_proxy.obj trayfix-build\generated\powrprof_proxy.asm
          cl /nologo /std:c++17 /O2 /EHsc /LD /I trayfix-build\generated tools\trayfix-prototype\powrprof_trayfix_v4.cpp trayfix-build\powrprof_proxy.obj /Fe:trayfix-build\powrprof.dll /link /DEF:trayfix-build\generated\powrprof_proxy.def /INCREMENTAL:NO
          dumpbin /exports trayfix-build\powrprof.dll

      - name: Verify complete system export parity
        shell: pwsh
        run: |
          function Get-ExportNames([string]$Path) {
            $names = @()
            foreach ($line in (& dumpbin /nologo /exports $Path)) {
              if ($line -match '^\s*(\d+)\s+([0-9A-Fa-f]+)\s+([0-9A-Fa-f]+)\s+(\S+)(?:\s*=.*)?$') {
                if ($Matches[4] -ne '[NONAME]') {
                  $names += $Matches[4]
                }
              }
            }
            return $names | Sort-Object -Unique
          }

          $system = Get-ExportNames "$env:SystemRoot\System32\powrprof.dll"
          $proxy = Get-ExportNames "trayfix-build\powrprof.dll"
          $missing = $system | Where-Object { $_ -notin $proxy }
          if ($missing.Count -gt 0) {
            Write-Host 'Missing proxy exports:'
            $missing | ForEach-Object { Write-Host "  $_" }
            throw "Proxy is missing $($missing.Count) system PowrProf export(s)"
          }
          if ('GetPwrCapabilities' -notin $proxy) {
            throw 'GetPwrCapabilities is not exported by the proxy'
          }
          Write-Host "System exports: $($system.Count); proxy exports: $($proxy.Count)"

      - name: Build basic load test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\powrprof_load_test.cpp /Fe:trayfix-build\powrprof_load_test.exe

      - name: Verify application-directory loading and CallNtPowerInformation
        shell: pwsh
        working-directory: trayfix-build
        run: .\powrprof_load_test.exe

      - name: Build NVIDIA compatibility test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\powrprof_nvidia_compat_test.cpp /Fe:trayfix-build\powrprof_nvidia_compat_test.exe

      - name: Verify GetPwrCapabilities and platform-role forwarding
        shell: pwsh
        working-directory: trayfix-build
        run: |
          $marker = Join-Path $PWD 'powrprof-forward-marker.txt'
          $env:MAAEND_TRAYFIX_TEST_MARKER = $marker
          .\powrprof_nvidia_compat_test.exe
          if ($LASTEXITCODE -ne 0) {
            throw "powrprof_nvidia_compat_test failed with exit code $LASTEXITCODE"
          }
          $text = Get-Content $marker -Raw -Encoding Unicode
          Write-Host $text
          if ($text -notmatch 'system-powrprof-loaded') {
            throw 'Proxy did not load the real System32 PowrProf.dll'
          }

      - name: Build tray exit harness
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\tray_exit_test.cpp /Fe:trayfix-build\tray_exit_test.exe /link /SUBSYSTEM:WINDOWS

      - name: Verify independent monitor performs tray cleanup
        shell: pwsh
        working-directory: trayfix-build
        run: |
          $marker = Join-Path $PWD 'cleanup-marker.txt'
          $env:MAAEND_TRAYFIX_TEST_MARKER = $marker
          .\tray_exit_test.exe

          $deadline = (Get-Date).AddSeconds(10)
          $text = ''
          do {
            Start-Sleep -Milliseconds 250
            if (Test-Path $marker) {
              $text = Get-Content $marker -Raw -Encoding Unicode
            }
          } while ((Get-Date) -lt $deadline -and $text -notmatch 'monitor-cleanup-called')

          Write-Host $text
          if ($text -notmatch 'hook-installed') {
            throw 'Shell_NotifyIconW hook was not installed'
          }
          if ($text -notmatch 'hook-seen') {
            throw 'Shell_NotifyIconW hook did not observe NIM_ADD'
          }
          if ($text -notmatch 'monitor-started') {
            throw 'Independent rundll32 monitor was not started'
          }
          if ($text -notmatch 'monitor-cleanup-called') {
            throw 'Independent monitor did not execute NIM_DELETE after parent exit'
          }

      - name: Package DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trayfix-package | Out-Null
          Copy-Item trayfix-build\powrprof.dll trayfix-package\powrprof.dll
          @'
          MaaEnd TrayFix v4 (x86_64)

          Install:
            Copy powrprof.dll into the same directory as MaaEnd.exe.

          Uninstall:
            Exit MaaEnd and delete powrprof.dll.

          Purpose:
            Prevents MaaEnd's stale notification-area icon after process exit.
            An independent Windows rundll32 monitor waits for MaaEnd to terminate
            and then sends NIM_DELETE to Explorer.

          Compatibility:
            This build mirrors the complete named export surface of the Windows
            System32 PowrProf.dll used by the build runner. Calls are lazily
            forwarded through x64 register-preserving tail-jump stubs to the real
            System32 PowrProf.dll. This includes NVIDIA-used APIs such as
            GetPwrCapabilities, PowerDeterminePlatformRole, and
            PowerDeterminePlatformRoleEx.
          '@ | Set-Content -Encoding UTF8 trayfix-package\README.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-TrayFix-win-x86_64-v4
          path: trayfix-package
          retention-days: 14
