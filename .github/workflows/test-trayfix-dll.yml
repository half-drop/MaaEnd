name: test-trayfix-dll

on:
  push:
    branches:
      - agent/fix-tray-cleanup
    paths:
      - "tools/trayfix-prototype/**"
      - ".github/workflows/test-trayfix-dll.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify PowrProf wrapper targets
        shell: cmd
        run: |
          dumpbin /imports C:\Windows\System32\powrprof.dll | findstr /I "NtPowerInformation"
          dumpbin /exports C:\Windows\System32\powrprof.dll | findstr /I "PowerDeterminePlatformRole"

      - name: Compare system PowrProf with ntdll
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\power_compare.cpp /Fe:power_compare.exe
          power_compare.exe

      - name: Build final TrayFix DLL
        shell: cmd
        run: |
          mkdir trayfix-build
          cl /nologo /std:c++17 /O2 /EHsc /LD tools\trayfix-prototype\powrprof_trayfix_v3.cpp /Fe:trayfix-build\powrprof.dll /link /INCREMENTAL:NO
          dumpbin /exports trayfix-build\powrprof.dll

      - name: Build load test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\powrprof_load_test.cpp /Fe:trayfix-build\powrprof_load_test.exe

      - name: Verify single-file application-directory loading
        shell: pwsh
        working-directory: trayfix-build
        run: .\powrprof_load_test.exe

      - name: Build NVIDIA compatibility test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\platform_role_test.cpp /Fe:trayfix-build\platform_role_test.exe

      - name: Verify PowerDeterminePlatformRole forwarding
        shell: pwsh
        working-directory: trayfix-build
        run: |
          $marker = Join-Path $PWD 'platform-role-marker.txt'
          $env:MAAEND_TRAYFIX_TEST_MARKER = $marker
          .\platform_role_test.exe
          if ($LASTEXITCODE -ne 0) {
            throw "platform_role_test failed with exit code $LASTEXITCODE"
          }
          $text = Get-Content $marker -Raw -Encoding Unicode
          Write-Host $text
          if ($text -notmatch 'system-powrprof-loaded') {
            throw 'Proxy did not load the real System32 PowrProf.dll'
          }
          if ($text -notmatch 'platform-role-forwarded') {
            throw 'PowerDeterminePlatformRole was not forwarded'
          }
          if ($text -notmatch 'platform-role-ex-forwarded') {
            throw 'PowerDeterminePlatformRoleEx was not forwarded'
          }

      - name: Build tray exit harness
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\tray_exit_test.cpp /Fe:trayfix-build\tray_exit_test.exe /link /SUBSYSTEM:WINDOWS

      - name: Verify independent monitor performs tray cleanup
        shell: pwsh
        working-directory: trayfix-build
        run: |
          $marker = Join-Path $PWD 'cleanup-marker.txt'
          $env:MAAEND_TRAYFIX_TEST_MARKER = $marker
          .\tray_exit_test.exe

          $deadline = (Get-Date).AddSeconds(10)
          $text = ''
          do {
            Start-Sleep -Milliseconds 250
            if (Test-Path $marker) {
              $text = Get-Content $marker -Raw -Encoding Unicode
            }
          } while ((Get-Date) -lt $deadline -and $text -notmatch 'monitor-cleanup-called')

          Write-Host $text
          if ($text -notmatch 'hook-installed') {
            throw 'Shell_NotifyIconW hook was not installed'
          }
          if ($text -notmatch 'hook-seen') {
            throw 'Shell_NotifyIconW hook did not observe NIM_ADD'
          }
          if ($text -notmatch 'monitor-started') {
            throw 'Independent rundll32 monitor was not started'
          }
          if ($text -notmatch 'monitor-cleanup-called') {
            throw 'Independent monitor did not execute NIM_DELETE after parent exit'
          }

      - name: Package DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trayfix-package | Out-Null
          Copy-Item trayfix-build\powrprof.dll trayfix-package\powrprof.dll
          @'
          MaaEnd TrayFix (x86_64)

          Install:
            Copy powrprof.dll into the same directory as MaaEnd.exe.

          Uninstall:
            Exit MaaEnd and delete powrprof.dll.

          Purpose:
            Watches MaaEnd's notification-area icon registration. An independent
            Windows rundll32 monitor waits for MaaEnd to terminate and then sends
            NIM_DELETE to Explorer, preventing the stale/ghost tray icon.

          Compatibility:
            Forwards PowerDeterminePlatformRole and PowerDeterminePlatformRoleEx
            to the real System32 PowrProf.dll so NVIDIA user-mode driver modules
            can continue to resolve their PowrProf dependency.
          '@ | Set-Content -Encoding UTF8 trayfix-package\README.txt

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-TrayFix-win-x86_64
          path: trayfix-package
          retention-days: 14
