name: test-trayfix-dll

on:
  push:
    branches:
      - agent/fix-tray-cleanup
    paths:
      - "tools/trayfix-prototype/**"
      - ".github/workflows/test-trayfix-dll.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show KnownDLL status
        shell: pwsh
        run: |
          $known = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\KnownDLLs'
          $known.PSObject.Properties |
            Where-Object { $_.Name -notmatch '^PS' } |
            ForEach-Object { [PSCustomObject]@{ Name=$_.Name; Value=$_.Value } } |
            Where-Object { $_.Value -match '^(?i)(psapi|pdh|powrprof)\.dll$' } |
            Format-Table -AutoSize

      - name: Setup MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Inspect system PowrProf imports
        shell: cmd
        run: dumpbin /imports C:\Windows\System32\powrprof.dll | findstr /I "NtPowerInformation CallNtPowerInformation"

      - name: Build powrprof proxy probe
        shell: cmd
        run: |
          mkdir trayfix-build
          cl /nologo /std:c++17 /O2 /EHsc /LD tools\trayfix-prototype\powrprof_test.cpp /Fe:trayfix-build\powrprof.dll /link /INCREMENTAL:NO
          dumpbin /exports trayfix-build\powrprof.dll

      - name: Build powrprof load test
        shell: cmd
        run: cl /nologo /std:c++17 /O2 /EHsc tools\trayfix-prototype\powrprof_load_test.cpp /Fe:trayfix-build\powrprof_load_test.exe

      - name: Verify app-directory powrprof loading
        shell: pwsh
        working-directory: trayfix-build
        run: .\powrprof_load_test.exe
